name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + formatação)
        run: pnpm exec biome ci .

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  branch-policy:
    name: Política de branches (master)
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Exigir release/* ou hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "OK: '$HEAD_REF' pode ser integrada em master."
              ;;
            *)
              echo "::error::PRs para master devem vir de release/* ou hotfix/* (recebido: '$HEAD_REF')."
              exit 1
              ;;
          esac
