name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + formatação)
        run: pnpm exec biome ci .

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache dos navegadores
        id: cache-navegadores
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-chromium

      - name: Instalar Chromium
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Instalar dependências do sistema do Chromium
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Testes e2e
        run: pnpm e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Imagem Docker
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t concurso:ci .

      - name: Smoke test (health check e recusa sem senha)
        run: |
          codigo=0
          timeout 60 docker run --rm concurso:ci || codigo=$?
          if [ "$codigo" != 1 ]; then
            echo "::error::Sem APP_PASSWORD o container deveria sair com código 1 (saiu com $codigo)."
            exit 1
          fi
          docker run -d --name concurso -p 3000:3000 \
            -e APP_PASSWORD=senha-ci -e AUTH_SECRET=segredo-somente-para-o-ci-0123456789 concurso:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/export)" = 401
          # Sem MCP_TOKEN o endpoint MCP fica desligado.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/mcp)" = 404

      - name: Logs do container
        if: failure()
        run: docker logs concurso || true

  branch-policy:
    name: Política de branches (master)
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Exigir release/* ou hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "OK: '$HEAD_REF' pode ser integrada em master."
              ;;
            *)
              echo "::error::PRs para master devem vir de release/* ou hotfix/* (recebido: '$HEAD_REF')."
              exit 1
              ;;
          esac
